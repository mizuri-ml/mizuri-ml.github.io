title: "TECNOSYSLAN"
description: "Tecnología aplicada: ciberseguridad, redes, telecomunicaciones, noticias y herramientas gratuitas."
url: "https://mizuri-ml.github.io"
baseurl: ""
lang: "es"
timezone: "America/Guayaquil"
markdown: kramdown
highlighter: rouge
permalink: /articulos/:title/
future: false
show_excerpts: true
collections:
  herramientas:
    output: true
    permalink: /herramientas/:name/
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "herramientas"
    values:
      layout: tool
exclude:
  - README.md
  - GUIA_INSTALACION.md
  - SEGURIDAD_ADMIN.md
  - PLANTILLA_NOTICIA.md
  - PLANTILLA_HERRAMIENTA.html
  - _backend
  - .gitignore
  - .github
